<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title"><title id="title">Give every slide
a clear blueprint. — finished</title><rect width="1600" height="900" fill="#FAF9F6"/><text data-element-id="slide2.eyebrow" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-kerning="none" text-anchor="start" fill="#7C3AED" xml:space="preserve"><tspan x="96" y="74.92">02 / ANSWER</tspan></text><rect data-element-id="slide2.accent-rule" x="96" y="114" width="80" height="6" fill="#7C3AED"/><text data-element-id="slide2.headline" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" font-kerning="none" text-anchor="start" fill="#191724" xml:space="preserve"><tspan x="96" y="216.16">Give every slide</tspan><tspan x="96" y="292.96">a clear blueprint.</tspan></text><text data-element-id="slide2.takeaway" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="96" y="376.08">The workflow combines a story, a deliberate composition, and a controlled revision.</tspan></text><rect data-element-id="slide2.block1.panel" x="96" y="488" width="453.333" height="292" fill="#FFFFFF"/><rect data-element-id="slide2.block1.rule" x="96" y="488" width="453.333" height="6" fill="#7C3AED"/><text data-element-id="slide2.block1.number" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-kerning="none" text-anchor="start" fill="#7C3AED" xml:space="preserve"><tspan x="124" y="530.92">01</tspan></text><text data-element-id="slide2.block1.heading" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" font-kerning="none" text-anchor="start" fill="#191724" xml:space="preserve"><tspan x="124" y="591.84">Plan</tspan></text><text data-element-id="slide2.block1.body" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="124" y="680.2">Choose the message and</tspan><tspan x="124" y="716.2">keep supplied facts explicit.</tspan></text><rect data-element-id="slide2.block2.panel" x="573.333" y="488" width="453.333" height="292" fill="#FFFFFF"/><rect data-element-id="slide2.block2.rule" x="573.333" y="488" width="453.333" height="6" fill="#7C3AED"/><text data-element-id="slide2.block2.number" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-kerning="none" text-anchor="start" fill="#7C3AED" xml:space="preserve"><tspan x="601.333" y="530.92">02</tspan></text><text data-element-id="slide2.block2.heading" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" font-kerning="none" text-anchor="start" fill="#191724" xml:space="preserve"><tspan x="601.333" y="591.84">Compose</tspan></text><text data-element-id="slide2.block2.body" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="601.333" y="680.2">Build separate text, shapes,</tspan><tspan x="601.333" y="716.2">lines, and images.</tspan></text><rect data-element-id="slide2.block3.panel" x="1050.667" y="488" width="453.333" height="292" fill="#FFFFFF"/><rect data-element-id="slide2.block3.rule" x="1050.667" y="488" width="453.333" height="6" fill="#7C3AED"/><text data-element-id="slide2.block3.number" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-kerning="none" text-anchor="start" fill="#7C3AED" xml:space="preserve"><tspan x="1078.667" y="530.92">03</tspan></text><text data-element-id="slide2.block3.heading" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" font-kerning="none" text-anchor="start" fill="#191724" xml:space="preserve"><tspan x="1078.667" y="591.84">Direct</tspan></text><text data-element-id="slide2.block3.body" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="1078.667" y="680.2">Change the requested part</tspan><tspan x="1078.667" y="716.2">and preserve the rest.</tspan></text><line data-element-id="slide2.footer.rule" x1="96" y1="814" x2="1504" y2="814" stroke="#62606B" stroke-width="1"/><text data-element-id="slide2.footer.brand" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="96" y="855.16">GRAPHICROUTER</tspan></text><text data-element-id="slide2.footer.page" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" font-kerning="none" text-anchor="end" fill="#62606B" xml:space="preserve"><tspan x="1504" y="854.92">02 / 05</tspan></text></svg>