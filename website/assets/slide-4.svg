xt><rect data-element-id="slide4.block2.panel" x="812" y="488" width="692" height="292" fill="#FFFFFF"/><rect data-element-id="slide4.block2.rule" x="812" y="488" width="692" height="6" fill="#7C3AED"/><text data-element-id="slide4.block2.number" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-kerning="none" text-anchor="start" fill="#7C3AED" xml:space="preserve"><tspan x="840" y="530.92">02</tspan></text><text data-element-id="slide4.block2.heading" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" font-kerning="none" text-anchor="start" fill="#191724" xml:space="preserve"><tspan x="840" y="591.84">Precise change</tspan></text><text data-element-id="slide4.block2.body" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="840" y="680.2">One headline. Four other slides unchanged.</tspan></text><line data-element-id="slide4.footer.rule" x1="96" y1="814" x2="1504" y2="814" stroke="#62606B" stroke-width="1"/><text data-element-id="slide4.footer.brand" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-kerning="none" text-anchor="start" fill="#62606B" xml:space="preserve"><tspan x="96" y="855.16">GRAPHICROUTER</tspan></text><text data-element-id="slide4.footer.page" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" font-kerning="none" text-anchor="end" fill="#62606B" xml:space="preserve"><tspan x="1504" y="854.92">04 / 05</tspan></text></svg>